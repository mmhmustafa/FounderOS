name: security-and-release

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade "pip==26.1.2"
      - run: python -m pip install -c constraints.txt -e ".[dev,ssh,credentials,web]"
      - run: python -m pip check
      - run: python scripts/audit_dependencies.py
      - run: python scripts/generate_sbom.py
      - run: python scripts/runtime_manifest.py
      # PR-A2a: the licence gate runs against the tracked manifest and
      # policy BEFORE the notices regenerate, so a policy violation is
      # reported as itself rather than as a mysterious notices diff.
      - run: python scripts/check_licenses.py
      - run: python scripts/generate_third_party_notices.py
      # PR-A0/A2a: every generated compliance artifact is regenerated and
      # diff-checked — stale notices fail exactly like a stale SBOM or a
      # stale manifest.
      - run: git diff --exit-code -- sbom.cdx.json compliance/runtime-manifest.json THIRD-PARTY-NOTICES.txt
      - run: python scripts/check_docs.py
      - run: python -m pytest -q
